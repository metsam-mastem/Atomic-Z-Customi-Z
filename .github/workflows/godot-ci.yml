name: Godot CI

on:
  push:
    branches: [main, "**"]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        run: godot --headless --editor --path . --quit --verbose

      - name: Run vertical-slice smoke test
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Run neon skin runtime test
        run: godot --headless --path . --script res://tests/neon_skin_test.gd

      - name: Run canonical BuildDocument contract test
        run: godot --headless --path . --script res://tests/build_document_test.gd

      - name: Run surface material binder ownership test
        run: godot --headless --path . --script res://tests/surface_material_binder_test.gd

      - name: Run GLB surface catalog and BuildDocument integration test
        run: godot --headless --path . --script res://tests/glb_surface_catalog_test.gd

      - name: Run BuildDocument UI hydration test
        run: godot --headless --path . --script res://tests/build_document_ui_state_test.gd

  neon-simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run neon simulator unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile simulator
        run: python -m py_compile neon_simulator.py

  android-debug-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages for Godot 4.4
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.4.1 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Create ephemeral debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/atomicz-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Atomic Z,C=US"

      - name: Configure Godot Android SDK and signing paths
        run: |
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/atomicz-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate Android export prerequisites
        run: |
          grep -q '^textures/vram_compression/import_etc2_astc=true$' project.godot
          test -f "$RUNNER_TEMP/atomicz-debug.keystore"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Validate build scripts
        run: bash -n scripts/build_android.sh

      - name: Import, export and validate debug APK
        run: bash scripts/build_android.sh debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atomic-z-android-debug
          path: build/Atomic-Z-debug.apk
          if-no-files-found: error
          retention-days: 14
